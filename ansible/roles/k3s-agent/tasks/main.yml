---
# See ansible/roles/k3s-server/tasks/main.yml's identical task for why
# this is changed_when: false (PX-037) — get_url's change-detection
# against get.k3s.io's dynamically served script isn't reliable, and
# the real idempotency signal lives one task downstream regardless.
- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  changed_when: false

# K3S_URL/K3S_TOKEN come from the control-plane host's facts, set by the
# k3s-server role earlier in the same playbook run (see site.yml play
# order — k3s-server always runs before k3s-agent).
#
# Bounded via async/poll (5m) rather than left to run indefinitely —
# same TimeoutStartSec=0 risk documented for k3s-server's install task
# (see ansible/roles/k3s-server/tasks/main.yml), and a real risk here
# too since k3s-agent ships the same systemd unit behavior.
- name: Install k3s agent (worker) and join the cluster
  block:
    - name: Run the k3s install script
      ansible.builtin.command: /tmp/k3s-install.sh
      args:
        # k3s agent mode installs a single shared binary at
        # /usr/local/bin/k3s (invoked as `k3s agent`, confirmed via a
        # real k3s-agent.service ExecStart during PX-034's Molecule
        # run) — there is no separate k3s-agent binary to key off.
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_EXEC: "agent {{ k3s_agent_extra_install_args }}"
        K3S_URL: "https://{{ k3s_agent_control_plane_host }}:6443"
        K3S_TOKEN: "{{ hostvars[groups['k3s_control_plane'][0]]['k3s_node_token'] }}"
      async: 300
      poll: 15
  rescue:
    - name: Capture k3s-agent service status for diagnostics
      ansible.builtin.command: systemctl status k3s-agent --no-pager
      register: k3s_agent_status_debug
      failed_when: false
      changed_when: false

    - name: Capture k3s-agent journal for diagnostics
      ansible.builtin.command: journalctl -u k3s-agent --no-pager -n 100
      register: k3s_agent_journal_debug
      failed_when: false
      changed_when: false

    - name: Show diagnostics
      ansible.builtin.debug:
        msg: "{{ (k3s_agent_status_debug.stdout_lines | default([])) + ['---'] + (k3s_agent_journal_debug.stdout_lines | default([])) }}"

    - name: Re-raise the original failure
      ansible.builtin.fail:
        msg: "k3s-agent install did not complete within the bounded async window - see diagnostics above"

# Longhorn's storage-hosting components are restricted to wk-1/wk-2 via
# this label (k8s/longhorn/values.yaml), which until PX-039 had only
# ever been applied by hand (`kubectl label node wk-1/wk-2
# longhorn-storage=true`) — a rebuilt worker would silently rejoin
# without it and never host storage again. Delegated to the
# control-plane (kubectl / the k3s.yaml kubeconfig live there, not on
# the worker) and run after this worker has joined and gone Ready, so
# the label lands on a node the API server already knows about.
- name: Wait for this node to register as Ready in the k3s API
  delegate_to: "{{ groups['k3s_control_plane'][0] }}"
  ansible.builtin.command:
    cmd: "kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=120s"
  changed_when: false

- name: Check current longhorn-storage label on this node
  delegate_to: "{{ groups['k3s_control_plane'][0] }}"
  ansible.builtin.command:
    cmd: "kubectl get node {{ inventory_hostname }} -o jsonpath={.metadata.labels.longhorn-storage}"
  register: k3s_longhorn_storage_label
  changed_when: false

- name: Apply longhorn-storage=true label for Longhorn storage placement (PX-039)
  delegate_to: "{{ groups['k3s_control_plane'][0] }}"
  ansible.builtin.command:
    cmd: "kubectl label node {{ inventory_hostname }} longhorn-storage=true --overwrite"
  when: k3s_longhorn_storage_label.stdout != "true"
  changed_when: true
