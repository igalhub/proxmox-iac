---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Ensure baseline packages are installed
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - qemu-guest-agent
    state: present

# molecule-notest: qemu-guest-agent genuinely cannot start in a
# container (no real virtio-serial channel/device for it to talk to —
# confirmed via a real PX-034 Molecule run: "A dependency job for
# qemu-guest-agent.service failed"). This isn't a test-environment
# quirk to work around; the task is fundamentally guest-hardware-
# dependent and has no container equivalent, so it's excluded from
# Molecule's converge via its own built-in tag convention rather than
# faked. Real VM verification (this project's existing practice) is
# still the actual proof this task works — see docs/TICKETS.md PX-034.
- name: Ensure qemu-guest-agent is enabled and running
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  tags: [molecule-notest]

- name: Create non-root deploy user
  ansible.builtin.user:
    name: "{{ common_deploy_user }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true

- name: Allow deploy user passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ common_deploy_user }}"
    content: "{{ common_deploy_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"

- name: Install deploy user's SSH public key
  ansible.posix.authorized_key:
    user: "{{ common_deploy_user }}"
    key: "{{ lookup('file', common_deploy_user_ssh_public_key) }}"
    path: "/home/{{ common_deploy_user }}/.ssh/authorized_keys"
    state: present

# Hardening below assumes the deploy user's key access (just installed above)
# has been verified working before this ever runs for real — see
# docs/TICKETS.md PX-007 for the real-run gate. Both changes only take
# effect after an sshd restart, so a broken deploy-user key would still
# leave the current ubuntu-user session usable to fix it.
- name: Harden SSH - disable password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: Restart sshd

- name: Harden SSH - disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
  notify: Restart sshd
