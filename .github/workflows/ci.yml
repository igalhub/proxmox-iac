name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck all scripts
        run: |
          shopt -s globstar nullglob
          files=(*.sh **/*.sh)
          # hooks/pre-commit is a real bash script but has no .sh extension
          # (git hook naming convention) — include it explicitly.
          [ -f hooks/pre-commit ] && files+=(hooks/pre-commit)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found yet"; exit 0
          fi
          shellcheck "${files[@]}"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Terraform config
        id: check
        run: |
          shopt -s globstar nullglob
          if [ -d terraform ] && compgen -G "terraform/**/*.tf" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform/ not started yet, skipping"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.check.outputs.present == 'true'

      - name: terraform fmt -check
        if: steps.check.outputs.present == 'true'
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform validate
        if: steps.check.outputs.present == 'true'
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Ansible content
        id: check
        run: |
          shopt -s globstar nullglob
          if [ -d ansible ] && compgen -G "ansible/**/*.yml" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "ansible/ not started yet, skipping"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ansible-lint
        if: steps.check.outputs.present == 'true'
        run: pip install ansible-lint

      - name: Install Ansible collection dependencies
        if: steps.check.outputs.present == 'true'
        run: |
          if [ -f ansible/requirements.yml ]; then
            ansible-galaxy collection install -r ansible/requirements.yml
          fi

      - name: ansible-lint
        if: steps.check.outputs.present == 'true'
        run: ansible-lint ansible/

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for landing page Python code
        id: check
        run: |
          if [ -d landing ] && compgen -G "landing/*.py" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "landing/ not started yet, skipping"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ruff
        if: steps.check.outputs.present == 'true'
        run: pip install ruff

      - name: ruff check
        if: steps.check.outputs.present == 'true'
        run: ruff check landing/

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for landing page tests
        id: check
        run: |
          if [ -d landing/tests ] && compgen -G "landing/tests/*.py" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "landing/tests/ not started yet, skipping"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.present == 'true'
        run: pip install -r landing/requirements.txt -r landing/requirements-dev.txt

      - name: pytest
        if: steps.check.outputs.present == 'true'
        working-directory: landing
        run: pytest -q

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: Azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate k8s/ manifests
        run: ./scripts/validate-manifests.sh

  terraform-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Terraform tests
        id: check
        run: |
          shopt -s globstar nullglob
          if [ -d terraform/tests ] && compgen -G "terraform/tests/*.tftest.hcl" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform/tests/ not started yet, skipping"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.check.outputs.present == 'true'

      - name: terraform init
        if: steps.check.outputs.present == 'true'
        run: terraform -chdir=terraform init -backend=false

      - name: terraform test
        if: steps.check.outputs.present == 'true'
        run: terraform -chdir=terraform test
