# Adopts the existing Sealed Secrets controller Helm release (installed
# directly via `helm install` in PX-009) without a reinstall. Eighth
# PX-015 adoption, highest-stakes for a reason different from
# statefulness: this controller holds the keypair that decrypts every
# SealedSecret in the cluster (Redis auth, Grafana/Jenkins admin
# passwords, ArgoCD's own deploy key). The real risk of a bad sync here
# isn't data loss, it's "the active keypair Secret gets
# regenerated/replaced and decryption silently breaks for everything
# else at once."
#
# That risk is structurally bounded, not just hoped away: the chart
# itself never templates the active keypair Secret
# (`sealed-secrets-key<random>`, e.g. `sealed-secrets-keybnflv`) — the
# controller generates and stores it dynamically at first boot, with a
# random name suffix the chart has no way to predict or template. It is
# therefore not part of this Application's managed resource set at all
# and cannot be touched by any sync this Application ever performs.
# Verified independently anyway, not just assumed from reading the
# chart source: `helm template` against this exact values file renders
# no Secret resource of any kind, confirmed live via
# `kubectl -n kube-system get secret -l
# sealedsecrets.bitnami.com/sealed-secrets-key`, and the keypair
# Secret's data (sha256 of both `tls.crt`/`tls.key`) checked
# byte-for-byte identical before and after the real adoption sync, not
# just the controller pod's identity.
#
# Multi-source Application, same shape as the other Helm-sourced
# adoptions: chart from its upstream repo pinned to the exact version
# already live (2.19.1), values file stays in this repo via the
# `ref: values` source. Release name `sealed-secrets` matches the live
# release, so every rendered resource name is identical to what's
# already running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.19.1
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/k8s/sealed-secrets/values.yaml
    - repoURL: git@github.com:igalhub/proxmox-iac.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # Manual sync, no auto-prune/self-heal (docs/TICKETS.md PX-015
  # decision 3) — adoption itself happens via one explicit, reviewed
  # sync, not automatically the moment this Application is created.
