# Sealed as ArgoCD's real repo-credential secret shape (Opaque, labeled
# argocd.argoproj.io/secret-type: repository, keys type/url/sshPrivateKey)
# rather than a literal kubernetes.io/ssh-auth typed secret — ArgoCD only
# recognizes repo credentials in this shape, and "sync actually works" is
# the acceptance criterion, not the type string. Dedicated ed25519
# read-only deploy key, separate from Jenkins's
# (k8s/jenkins/jenkins-github-deploy-key-sealedsecret.yaml).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-github-deploy-key
  namespace: argocd
spec:
  encryptedData:
    sshPrivateKey: 
    type: 
    url: 
  template:
    metadata:
      labels:
        argocd.argoproj.io/secret-type: repository
      name: argocd-github-deploy-key
      namespace: argocd
    type: Opaque
