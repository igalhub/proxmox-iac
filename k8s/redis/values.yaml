# Primary + replica, per docs/SPEC.md — a straightforward Helm-deployed
# cache, deliberately not operator-managed (see SPEC.md's rationale).
#
# PX-022: storageClass explicitly `longhorn` on both persistence blocks —
# previously unset (defaulted to the cluster's default class), which
# would have silently reverted any future PVC recreation back to
# `local-path` (still the cluster default) despite the live PVCs having
# been migrated to Longhorn via a manual PV-retain/rebind, since that
# migration happened via raw kubectl and never touched this file.
architecture: replication

auth:
  existingSecret: redis-auth
  existingSecretPasswordKey: redis-password

master:
  nodeSelector:
    kubernetes.io/hostname: wk-1
  persistence:
    size: 1Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

replica:
  replicaCount: 1
  nodeSelector:
    kubernetes.io/hostname: wk-1
  persistence:
    size: 1Gi
    storageClass: longhorn
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
