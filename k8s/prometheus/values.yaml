# Standalone Prometheus, deliberately lighter than kube-prometheus-stack
# (no pushgateway) per docs/SPEC.md's sizing rationale against the
# confirmed-real remaining RAM headroom.
#
# Alertmanager (PX-025) is deployed as its own separate Helm release
# (k8s/alertmanager/), not this chart's bundled subchart — same reason
# kube-state-metrics/node-exporter are separate releases below: this
# project places services by role (docs/SPEC.md §1), which a bundled
# subchart's placement can't express. Wired via server.alertmanagers.
alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false

# kube-state-metrics and node-exporter are already installed separately
# (own Helm releases, pinned per docs/SPEC.md's role split) - disabling
# the chart's bundled subcharts avoids a duplicate install.
kube-state-metrics:
  enabled: false

prometheus-node-exporter:
  enabled: false

server:
  nodeSelector:
    kubernetes.io/hostname: wk-1
  persistentVolume:
    enabled: true
    size: 4Gi
  retention: "7d"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager.monitoring.svc.cluster.local:9093

# PX-025: a small, deliberately curated rule set — CrashLoopBackOff and
# PodNotReady-for-10m — rather than trying to cover everything at once,
# to avoid the alert-fatigue trap of an overly broad initial rule set.
# Both metrics confirmed live via kube-state-metrics before writing
# these (kube_pod_container_status_waiting_reason,
# kube_pod_status_ready), not assumed to exist.
#
# PodNotReady's real-trigger test caught a real bug in the first draft
# of this rule, not a hypothetical: it fired on `helm-debug` (jenkins
# namespace), a Completed one-shot debug pod from 2026-07-30 that will
# never be Ready again *by design* — a false positive, exactly the
# alert-fatigue trap this ticket set out to avoid. Fixed by restricting
# to pods actually in the Running phase (kube_pod_status_phase), so a
# correctly-terminal pod can't trip it.
serverFiles:
  alerting_rules.yml:
    groups:
      - name: pod-health
        rules:
          - alert: PodCrashLooping
            expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} == 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
              description: "Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} is in CrashLoopBackOff — the same undetected-for-hours failure mode PX-023's Jenkins incident surfaced."
          - alert: PodNotReady
            expr: kube_pod_status_ready{condition="false"} == 1 and on(namespace, pod) kube_pod_status_phase{phase="Running"} == 1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.namespace }}/{{ $labels.pod }} has not been Ready for 10m"
              description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been reporting NotReady for over 10 minutes."

# PX-026: Longhorn and MinIO both set no prometheus.io/scrape pod/service
# annotations in their charts (confirmed by reading both charts'
# templates directly — neither has an annotation-based discovery hook,
# unlike Redis/Postgres below which reuse the default `kubernetes-pods`
# job via podAnnotations instead). Static targets against each Service's
# stable in-cluster DNS name, since both are single ClusterIP Services
# that won't change — simpler than a kubernetes_sd_configs job for two
# known, fixed targets.
extraScrapeConfigs: |
  - job_name: longhorn
    metrics_path: /metrics
    static_configs:
      - targets:
          - longhorn-backend.longhorn-system.svc.cluster.local:9500
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets:
          - minio.minio.svc.cluster.local:9000
