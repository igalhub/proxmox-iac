# PX-025 — Telegram is the sole receiver this pass (Discord deliberately
# deferred, see docs/TICKETS.md). Deployed as its own Helm release, same
# as kube-state-metrics/node-exporter — the `prometheus` chart's bundled
# `alertmanager` subchart stays disabled (k8s/prometheus/values.yaml)
# to avoid a duplicate install, same reasoning as those two.
nodeSelector:
  kubernetes.io/hostname: wk-1

persistence:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Bot token/chat ID never touch this file or git: an earlier draft tried
# Alertmanager's --config.expand-env, but real verification (not
# assumed) showed that flag doesn't exist in this Alertmanager version
# (v0.33.1) — "unknown long flag", confirmed via the container's own
# --help output before deploying for real. Correct mechanism, verified
# the same way (a throwaway pod, checked for schema-parse errors before
# trusting it): telegram_configs' own bot_token_file/chat_id_file
# fields, reading straight from the mounted SealedSecret — same
# secretKeyRef-equivalent pattern used everywhere else in this repo,
# just file-based rather than env-based since Alertmanager's receiver
# schema supports it natively for exactly this purpose.
extraSecretMounts:
  - name: telegram-secret
    mountPath: /etc/alertmanager-secrets
    secretName: alertmanager-telegram
    readOnly: true

config:
  enabled: true
  global: {}
  route:
    receiver: telegram
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 3h
  receivers:
    - name: telegram
      telegram_configs:
        - bot_token_file: /etc/alertmanager-secrets/botToken
          chat_id_file: /etc/alertmanager-secrets/chatId
          parse_mode: "HTML"
          send_resolved: true
